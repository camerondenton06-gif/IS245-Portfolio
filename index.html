<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IS245 Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">IS245 Portfolio</div>
    <nav class="site-nav">
      <a href="#home">Home</a>
      <a href="#courses">Courses</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="page-content">
    <section id="home" class="content-section">
      <div id="homeContent"></div>
    </section>

    <section id="courses" class="content-section">
      <h2>Courses</h2>
      <div id="coursesContent" class="cards-grid"></div>
    </section>

    <section id="projects" class="content-section">
      <h2>Projects</h2>
      <div id="projectsContent" class="cards-grid"></div>
    </section>

    <section id="contact" class="content-section">
      <div id="contactContent"></div>
      <div class="form-card">
        <h3>Contact Form</h3>
        <form id="infoForm" novalidate>
          <label for="nameInput">Name</label>
          <input type="text" id="nameInput" placeholder="Your full name" />

          <label for="addressInput">Address</label>
          <input type="text" id="addressInput" placeholder="Your address" />

          <label for="ageInput">Age</label>
          <input type="number" id="ageInput" placeholder="Your age" min="1" max="120" />

          <button type="submit">Submit</button>
          <p id="formMessage" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Made for IS245 assignment.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
